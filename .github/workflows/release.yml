name: Release

# metadata.json drives releases: a push to main that changes it builds the
# zip, and publishes it as release v<version-name> when that version has no
# release yet. Bumping version and version-name is all a release takes.
on:
  push:
    branches:
      - main
    paths:
      - metadata.json
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two quick pushes cannot publish the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin zip

      - name: Read metadata.json
        id: meta
        run: |
          echo "uuid=$(python3 -c "import json;print(json.load(open('metadata.json'))['uuid'])")" >> "$GITHUB_OUTPUT"
          echo "name=$(python3 -c "import json;print(json.load(open('metadata.json'))['name'])")" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 -c "import json;print(json.load(open('metadata.json'))['version-name'])")" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A change that keeps the version, a new shell-version for example,
          # is built but not published again.
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "v${{ steps.meta.outputs.version }} is already released, building only"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check JavaScript syntax
        run: |
          # The sources are ES modules, which node only parses as such under .mjs.
          for f in extension.js prefs.js; do
            cp "$f" "${f%.js}.mjs"
            node --check "${f%.js}.mjs"
            rm "${f%.js}.mjs"
          done

      - name: Build the extension zip
        run: |
          glib-compile-schemas schemas
          zip -r "${{ steps.meta.outputs.uuid }}.shell-extension.zip" metadata.json extension.js prefs.js stylesheet.css schemas icons

      - name: Upload the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.uuid }}
          path: ${{ steps.meta.outputs.uuid }}.shell-extension.zip

      - name: Publish the release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Download the zip below and install it with:" \
            "" \
            "    gnome-extensions install --force ${{ steps.meta.outputs.uuid }}.shell-extension.zip" \
            "" \
            "Then log out and log back in, GNOME Shell cannot be restarted on Wayland, and enable it:" \
            "" \
            "    gnome-extensions enable ${{ steps.meta.outputs.uuid }}" \
            > notes.md
          # The tag is created on the commit that was built.
          gh release create "v${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.uuid }}.shell-extension.zip" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md
